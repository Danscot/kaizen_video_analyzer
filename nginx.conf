# /etc/nginx/sites-available/kaizen
#
# CRITICAL FOR SSE: proxy_buffering must be off globally or per-location.
# Without this, nginx buffers the entire response before sending it to the
# client — SSE events never reach the browser until the stream closes.

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    client_max_body_size 640M;

    # SSE streams can run for minutes — these must be high
    proxy_read_timeout   700s;
    proxy_send_timeout   700s;
    proxy_connect_timeout 10s;

    gzip off;  # gzip breaks SSE chunked streaming

    location / {
        proxy_pass          http://127.0.0.1:5000;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        # ── SSE CRITICAL — disable all buffering ──────────────────────────
        proxy_buffering           off;
        proxy_cache               off;
        proxy_set_header          Connection '';
        chunked_transfer_encoding on;
        proxy_read_timeout        700s;
    }

    # Static files served by WhiteNoise through Django — no alias needed.
    # Optional: uncomment to serve from disk directly (marginally faster):
    # location /static/ {
    #     alias /opt/kaizen/staticfiles/;
    #     expires 30d;
    #     add_header Cache-Control "public";
    # }
}

